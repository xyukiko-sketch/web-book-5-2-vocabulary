<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Book 5-2 Vocabulary</title>
<style>
:root{--navy:#315f9d;--pale:#eef5ff;--ink:#1e293b;--muted:#64748b;--line:#dbe4f0;--good:#15803d;--bad:#c2410c}*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif;background:linear-gradient(135deg,#edf4ff,#fafcff);color:var(--ink)}button,select{font:inherit}.app{max-width:940px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:clamp(25px,4vw,39px)}.sub{color:var(--muted);margin:6px 0}.stats,.tabs,.settings,.controls{display:flex;gap:9px;flex-wrap:wrap}.pill,.tab,.setting{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:700}.tabs{margin:20px 0 12px}.tab{cursor:pointer;border-radius:12px}.tab.active,.primary{background:var(--navy);color:#fff}.settings{margin-bottom:15px}.setting{border-radius:10px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;min-height:470px;padding:clamp(20px,5vw,42px);box-shadow:0 18px 50px #315f9d17}.hidden{display:none!important}.progress{height:8px;background:#e7edf5;border-radius:9px;overflow:hidden;margin-bottom:20px}.bar{height:100%;background:linear-gradient(90deg,#315f9d,#60a5fa);transition:.3s}.small{color:var(--muted);font-size:14px}.word{text-align:center;font-size:clamp(32px,7vw,58px);font-weight:850;margin:25px 0 5px}.ipa{text-align:center;color:var(--muted);font-size:19px}.meaning{text-align:center;font-size:clamp(22px,4vw,31px);font-weight:800;margin:26px 0 8px}.detail{background:var(--pale);border-radius:15px;padding:16px;line-height:1.75;margin-top:16px}.detail b{color:#244b7b}.controls{justify-content:center;margin-top:24px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.secondary{background:#e7eef8;color:#244b7b}.good{background:#dcfce7;color:var(--good)}.bad{background:#ffedd5;color:var(--bad)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.option{border:2px solid var(--line);border-radius:14px;background:#fff;padding:15px;text-align:left;font-weight:750;cursor:pointer;min-height:64px}.option.correct{background:#f0fdf4;border-color:#22c55e}.option.wrong{background:#fff7ed;border-color:#f97316}.feedback{text-align:center;font-weight:850;min-height:28px;margin-top:15px}.timer{height:7px;background:#dbeafe;border-radius:8px;margin:12px 0}.timer>div{height:100%;background:#f59e0b;border-radius:8px}.list{display:grid;gap:9px}.row{border:1px solid var(--line);border-radius:13px;padding:12px;display:grid;grid-template-columns:1fr 1.15fr auto;gap:10px;align-items:center}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef2f7}.badge.done{background:#dcfce7;color:#166534}.result{text-align:center}.result h2{font-size:36px}.celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-30px;width:12px;height:20px;animation:fall 2.1s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(800deg);opacity:.2}}@media(max-width:650px){.options{grid-template-columns:1fr}.row{grid-template-columns:1fr}.app{padding:14px}}
</style></head><body><div id="fx" class="celebrate"></div><div class="app">
<div class="top"><div><h1>Web Book 5-2 Vocabulary</h1><p class="sub">英検準1級｜20語トレーナー</p></div><div class="stats"><span class="pill">今日 <b id="today">0</b>/50問</span><span class="pill">習得 <b id="mastered">0</b>/<b id="total">0</b></span><span class="pill">正答率 <b id="accuracy">–</b></span></div></div>
<div class="tabs"><button class="tab active" data-view="flash">フラッシュカード</button><button class="tab" data-view="quiz">4択クイズ</button><button class="tab" data-view="list">単語一覧</button></div>
<div class="settings"><select id="direction" class="setting"><option value="en-ja">英語 → 日本語</option><option value="ja-en">日本語 → 英語</option></select><select id="filter" class="setting"><option value="learning">覚えていない単語だけ</option><option value="all">すべての単語</option><option value="due">今日の復習</option><option value="mastered">覚えた単語だけ</option></select><label class="setting"><input id="autoSpeak" type="checkbox" checked> 自動読み上げ</label><label class="setting"><input id="sound" type="checkbox" checked> 効果音</label><button id="shuffle" class="btn secondary">シャッフル</button><button id="reset" class="btn secondary">履歴をリセット</button></div>
<main class="card"><div class="progress"><div id="bar" class="bar"></div></div><section id="flash"></section><section id="quiz" class="hidden"></section><section id="list" class="hidden"></section><section id="result" class="hidden result"></section></main><p class="sub" style="text-align:center">学習履歴はこのブラウザ内に保存されます。</p></div>
<script>
const words=[
{w:'zephyr',ipa:'/ˈzefər/',pos:'n.',ja:'そよ風、微風',root:'ギリシャ神話の西風の神 Zephyrus。やさしい風のイメージ',coll:'a gentle zephyr',ex:'The gentle zephyr carried the scent of blooming flowers through the air.'},
{w:'bombastic',ipa:'/bɑːmˈbæstɪk/',pos:'adj.',ja:'大げさな、仰々しい',root:'bombast（大言壮語）＋ -ic。中身より言葉を大きく見せる',coll:'a bombastic speech',ex:'The politician’s bombastic speech impressed some listeners but offered few practical solutions.'},
{w:'cacophony',ipa:'/kəˈkɑːfəni/',pos:'n.',ja:'不協和音、騒々しい音',root:'caco-（悪い）＋ -phony（音）',coll:'a cacophony of sounds',ex:'The bustling city streets created a constant cacophony of sounds.'},
{w:'whimsical',ipa:'/ˈwɪmzɪkl/',pos:'adj.',ja:'風変わりで愉快な、気まぐれな',root:'whim（気まぐれ）＋ -ical',coll:'a whimsical story',ex:'The writer’s whimsical stories reflected his humorous and imaginative personality.'},
{w:'xenophobia',ipa:'/ˌzenəˈfoʊbiə/',pos:'n.',ja:'外国人嫌悪、異文化への恐れ',root:'xeno-（異質な・外国の）＋ -phobia（恐怖）',coll:'the rise of xenophobia',ex:'The rise of xenophobia in urban areas has led to growing tension among different cultural groups.'},
{w:'enervate',ipa:'/ˈenərveɪt/',pos:'v.',ja:'気力・体力を奪う、弱らせる',root:'e-（外へ）＋ nerve（力）＝力を外へ抜く',coll:'enervate employees',ex:'Working long hours without rest began to enervate the employees, reducing their motivation.'},
{w:'fallacious',ipa:'/fəˈleɪʃəs/',pos:'adj.',ja:'誤った、虚偽の',root:'fallacy（誤った推論）＋ -ous',coll:'a fallacious conclusion',ex:'His conclusion was fallacious because it ignored important facts and evidence.'},
{w:'grandiose',ipa:'/ˈɡrændioʊs/',pos:'adj.',ja:'壮大な、仰々しい',root:'grand（大きい）から。「必要以上に立派」のニュアンスもある',coll:'a grandiose palace',ex:"The king's grandiose palace was a symbol of his wealth and power."},
{w:'yearn',ipa:'/jɜːrn/',pos:'v.',ja:'切望する、恋しく思う',root:'古英語 giernan（強く望む）',coll:'yearn for freedom',ex:'He couldn’t help but yearn for the freedom and excitement of life abroad.'},
{w:'heinous',ipa:'/ˈheɪnəs/',pos:'adj.',ja:'極悪な、憎むべき',root:'古フランス語 haine（憎しみ）に関連',coll:'a heinous act',ex:'The criminal committed a heinous act that shocked the entire community.'},
{w:'incessant',ipa:'/ɪnˈsesnt/',pos:'adj.',ja:'絶え間ない、ひっきりなしの',root:'in-（～でない）＋ cess（止まる）＋ -ant',coll:'incessant rain',ex:'The incessant rain continued for days, causing widespread flooding.'},
{w:'maverick',ipa:'/ˈmævərɪk/',pos:'n./adj.',ja:'一匹狼、独自路線の人（の）',root:'群れの所有印を付けなかった牧場主 Samuel Maverick の姓から',coll:'be known as a maverick',ex:'Known as a maverick, the scientist often challenged accepted theories with bold ideas.'},
{w:'superfluous',ipa:'/suːˈpɜːrfluəs/',pos:'adj.',ja:'余分な、不必要な',root:'super-（上・超えて）＋ flu（流れる）＝あふれ出るほど余分',coll:'superfluous information',ex:'The editor removed superfluous information to make the report clearer and more focused.'},
{w:'supercilious',ipa:'/ˌsuːpərˈsɪliəs/',pos:'adj.',ja:'尊大な、人を見下した',root:'ラテン語 supercilium（眉）＝眉を上げて見下すイメージ',coll:'a supercilious tone',ex:'The supercilious tone of the executive made it difficult for employees to voice their concerns.'},
{w:'unbridled',ipa:'/ʌnˈbraɪdld/',pos:'adj.',ja:'抑制のない、野放しの',root:'un-（ない）＋ bridle（馬具・手綱）＝手綱を外した',coll:'unbridled enthusiasm',ex:'The unbridled enthusiasm of the fans was evident as they cheered for their team.'},
{w:'vehement',ipa:'/ˈviːəmənt/',pos:'adj.',ja:'激しい、強い感情を込めた',root:'ラテン語 vehemens（激しい）',coll:'a vehement speech',ex:'The politician delivered a vehement speech, expressing strong opinions on the matter.'},
{w:'acrimonious',ipa:'/ˌækrɪˈmoʊniəs/',pos:'adj.',ja:'とげとげしい、険悪な',root:'acrimony（辛辣さ）＋ -ous。acer（鋭い）と同系',coll:'an acrimonious discussion',ex:'What began as a calm discussion turned acrimonious when personal attacks were made.'},
{w:'trepidation',ipa:'/ˌtrepɪˈdeɪʃn/',pos:'n.',ja:'不安、恐れ、おののき',root:'ラテン語 trepidare（震える）＋ -tion',coll:'a sense of trepidation',ex:'As the interview date drew closer, she felt a sense of trepidation about answering complex questions.'},
{w:'bourgeois',ipa:'/ˌbʊrˈʒwɑː/',pos:'adj./n.',ja:'中産階級の（人）、ブルジョワの',root:'フランス語 bourg（町）→町に住む中産階級',coll:'a bourgeois lifestyle',ex:'The bourgeois lifestyle is associated with the middle class and their values.'},
{w:'complacent',ipa:'/kəmˈpleɪsnt/',pos:'adj.',ja:'現状に満足して油断した',root:'ラテン語 complacere（大いに喜ばせる）→自己満足する',coll:'a complacent attitude',ex:"The team's complacent attitude led to a decline in performance over time."}
];
const KEY='wb52_vocab_progress_v1',PREF='wb52_vocab_prefs_v1',TARGET=5,GOAL=50,DAY=86400000;
const $=id=>document.getElementById(id),todayKey=()=>new Date().toLocaleDateString('sv-SE');
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{p:{},day:todayKey(),daily:0,correct:0,total:0,sessionC:0,sessionT:0};if(s.day!==todayKey()){s.day=todayKey();s.daily=0;s.sessionC=0;s.sessionT=0}
let pref=JSON.parse(localStorage.getItem(PREF)||'{}'),view='flash',deck=[],i=0,timer=null,remaining=4,answered=false;
$('autoSpeak').checked=pref.autoSpeak!==false;$('sound').checked=pref.sound!==false;
function rec(w){return s.p[w]||(s.p[w]={streak:0,mastered:false,due:null,interval:1,wrong:0})}function save(){localStorage.setItem(KEY,JSON.stringify(s));stats()}
function dateAdd(n){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}function isDue(x){let r=rec(x.w);return r.mastered&&r.due&&r.due<=todayKey()}
function pool(){let f=$('filter').value;if(f==='due')return words.filter(isDue);if(f==='mastered')return words.filter(x=>rec(x.w).mastered);if(f==='all')return words.filter(x=>!rec(x.w).mastered);return words.filter(x=>!rec(x.w).mastered)}
function shuffle(a){a=[...a];for(let j=a.length-1;j;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function rebuild(){deck=shuffle(pool()).sort((a,b)=>rec(b.w).wrong-rec(a.w).wrong);i=0;render()}
function pa(x){let en=$('direction').value==='en-ja';return{p:en?x.w:x.ja,a:en?x.ja:x.w,ipa:en?x.ipa:''}}
function stats(){$('today').textContent=s.daily;$('mastered').textContent=words.filter(x=>rec(x.w).mastered).length;$('total').textContent=words.length;$('accuracy').textContent=s.total?Math.round(s.correct/s.total*100)+'%':'–'}
function speak(x){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.w);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function auto(x){if($('autoSpeak').checked&&$('direction').value==='en-ja')setTimeout(()=>speak(x),100)}
let ac;function tone(f,t,d,v=.1){if(!$('sound').checked)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(v,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}function chime(ok){(ok?[[523,0,.13],[659,.08,.15],[784,.16,.2]]:[[220,0,.18],[175,.14,.25]]).forEach(n=>tone(...n))}
function confetti(n=70){let f=$('fx'),c=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7'];f.innerHTML='';for(let j=0;j<n;j++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=c[j%c.length];e.style.setProperty('--x',(Math.random()*220-110)+'px');e.style.animationDelay=Math.random()*.5+'s';f.appendChild(e)}setTimeout(()=>f.innerHTML='',2600)}
function empty(msg){return `<div class="meaning">${msg}</div><div class="controls"><button class="btn secondary" onclick="document.getElementById('filter').value='learning';rebuild()">未習得単語へ</button></div>`}
function render(){clearInterval(timer);['flash','quiz','list','result'].forEach(x=>$(x).classList.toggle('hidden',x!==view));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='flash')flash();if(view==='quiz')quiz();if(view==='list')list();stats()}
function flash(){if(!deck.length){$('flash').innerHTML=empty($('filter').value==='due'?'今日復習する単語はありません':'該当する単語はありません');return}let x=deck[i%deck.length],q=pa(x),r=rec(x.w);$('bar').style.width=(r.streak/TARGET*100)+'%';$('flash').innerHTML=`<div class="small">${i+1}/${deck.length}｜連続正解 ${r.streak}/5</div><div class="word">${q.p}</div><div class="ipa">${q.ipa}</div><div class="controls"><button class="btn secondary" onclick="speak(words.find(z=>z.w===${JSON.stringify(x.w)}))">🔊 読み上げ</button><button class="btn primary" id="show">答えを見る</button></div><div id="ans" class="hidden"><div class="meaning">${q.a}</div><div class="detail"><b>${x.pos}</b>　${x.ex}<br><b>語源・イメージ：</b>${x.root}<br><b>コロケーション：</b>${x.coll}</div><div class="controls"><button class="btn bad" onclick="flashRate(false)">もう一度</button><button class="btn good" onclick="flashRate(true)">正解・次へ</button></div></div>`;$('show').onclick=()=>{$('show').classList.add('hidden');$('ans').classList.remove('hidden')};auto(x)}
function learn(x,ok,dueMode=false){let r=rec(x.w);if(ok){r.streak++;if(dueMode){r.interval=Math.min(30,Math.max(2,r.interval*2));r.due=dateAdd(r.interval)}else if(r.streak>=TARGET){r.mastered=true;r.due=dateAdd(1);confetti();[523,659,784,1047,1319].forEach((f,k)=>tone(f,k*.08,.3,.13))}}else{r.streak=0;r.wrong++;if(dueMode)r.due=dateAdd(1)}save()}
function flashRate(ok){let x=deck[i%deck.length];learn(x,ok,$('filter').value==='due');chime(ok);if(rec(x.w).mastered&&$('filter').value!=='due')deck=deck.filter(y=>y.w!==x.w);else if(!ok&&deck.length>1)deck.splice(Math.min(i+3,deck.length),0,x);if(deck.length)i=(i+1)%deck.length;setTimeout(flash,ok?350:180)}
function quiz(){if(s.daily>=GOAL){finish();return}if(!deck.length){$('quiz').innerHTML=empty($('filter').value==='due'?'今日復習する単語はありません':'未習得単語をすべて覚えました');return}answered=false;let x=deck[i%deck.length],q=pa(x),others=shuffle(words.filter(y=>y.w!==x.w)).slice(0,3),choices=shuffle([x,...others]);$('bar').style.width='100%';$('quiz').innerHTML=`<div class="small">今日 ${s.daily}/50問｜残り <b id="sec">4.0</b>秒</div><div class="timer"><div id="timerbar"></div></div><div class="word">${q.p}</div><div class="ipa">${q.ipa}</div><div class="options" id="opts"></div><div id="feed" class="feedback"></div>`;choices.forEach(y=>{let b=document.createElement('button');b.className='option';b.textContent=$('direction').value==='en-ja'?y.ja:y.w;b.onclick=()=>answer(b,y.w===x.w,x);$('opts').appendChild(b)});remaining=4;timer=setInterval(()=>{remaining-=.1;$('sec').textContent=Math.max(0,remaining).toFixed(1);$('timerbar').style.width=Math.max(0,remaining/4*100)+'%';if(remaining<=0){clearInterval(timer);answer(null,false,x)}},100);auto(x)}
function answer(btn,ok,x){if(answered)return;answered=true;clearInterval(timer);s.daily++;s.total++;s.sessionT++;if(ok){s.correct++;s.sessionC++}learn(x,ok,$('filter').value==='due');chime(ok);[...$('opts').children].forEach(b=>{if(b.textContent===($('direction').value==='en-ja'?x.ja:x.w))b.classList.add('correct');b.disabled=true});if(btn&&!ok)btn.classList.add('wrong');$('feed').innerHTML=ok?'正解！':`正解：<b>${$('direction').value==='en-ja'?x.ja:x.w}</b>`;if(rec(x.w).mastered&&$('filter').value!=='due')deck=deck.filter(y=>y.w!==x.w);else if(!ok&&deck.length>1)deck.splice(Math.min(i+2,deck.length),0,x);if(deck.length)i=(i+1)%deck.length;save();setTimeout(()=>s.daily>=GOAL?finish():quiz(),900)}
function finish(){clearInterval(timer);view='result';render();let rate=s.sessionT?Math.round(s.sessionC/s.sessionT*100):0,face=rate>=90?'🏆':rate>=70?'🎉':'🌱';$('result').innerHTML=`<div style="font-size:76px">${face}</div><h2>50問達成！</h2><div class="meaning">50問中 ${s.sessionC}問正解<br>正答率 ${rate}%</div><div class="controls"><button class="btn primary" onclick="newSession()">新しい50問を始める</button></div>`;confetti(rate>=90?140:80);let notes=rate>=90?[523,659,784,1047,1319,1568]:rate>=70?[392,523,659,784,1047]:[330,392,440,523];notes.forEach((f,k)=>tone(f,k*.11,.42,.14))}
function newSession(){s.daily=0;s.sessionC=0;s.sessionT=0;save();view='quiz';rebuild()}
function list(){$('bar').style.width='100%';$('list').innerHTML='<div class="list">'+words.map(x=>`<div class="row"><b>${x.w}<br><span class="small">${x.ipa} ${x.pos}</span></b><span>${x.ja}<br><span class="small">${x.coll}</span></span><span class="badge ${rec(x.w).mastered?'done':''}">${rec(x.w).mastered?'習得済み':rec(x.w).streak+'/5'}</span></div>`).join('')+'</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;rebuild()});$('filter').onchange=rebuild;$('direction').onchange=render;$('shuffle').onclick=rebuild;$('autoSpeak').onchange=$('sound').onchange=()=>{pref={autoSpeak:$('autoSpeak').checked,sound:$('sound').checked};localStorage.setItem(PREF,JSON.stringify(pref))};$('reset').onclick=()=>{if(confirm('すべての学習履歴を削除しますか？')){localStorage.removeItem(KEY);location.reload()}};stats();rebuild();
</script></body></html>
